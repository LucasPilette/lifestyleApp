<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0D10">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Eclipse">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Thème mémorisé, appliqué avant le premier affichage (voir js/core/theme.js)
    (function () {
      var t = { theme: 'fall', mode: 'dark' };
      try { t = JSON.parse(localStorage.getItem('eclipse-theme')) || t; } catch (e) {}
      var light = t.mode === 'light' || (t.mode === 'auto' && matchMedia('(prefers-color-scheme: light)').matches);
      document.documentElement.setAttribute('data-theme', t.theme || 'fall');
      document.documentElement.setAttribute('data-mode', light ? 'light' : 'dark');
    })();
  </script>
  <title>Eclipse</title>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="app">
    <div class="boot"><div class="boot-dot"></div></div>
  </div>
  <div id="overlays"></div>
  <noscript>Cette application nécessite JavaScript.</noscript>
</body>
</html>
